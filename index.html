
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Stage Café | POS</title>
<style>
:root{--navy:#111827;--blue:#2563eb;--light:#f3f6fb;--line:#e2e8f0;--muted:#64748b;--pink:#e879a7}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#172033}
header{background:#111827;color:white;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:25px}
.brand small{display:block;font:10px Arial;letter-spacing:3px;color:#cbd5e1}
.topmeta{font-size:12px;color:#cbd5e1}
.layout{display:grid;grid-template-columns:220px minmax(300px,1fr) 350px;gap:12px;padding:12px;max-width:1600px;margin:auto}
.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:13px;min-width:0;box-shadow:0 2px 8px #0f172a08}
h3{margin:0 0 12px;font-size:15px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:bold;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:white;color:#172033}
.service{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:15px}
.service button,.catbtn{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:10px 5px;font-weight:bold;font-size:12px;cursor:pointer}
.service button.active,.catbtn.active{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}
.catgrid{display:flex;gap:7px;overflow:auto;padding-bottom:9px;margin-bottom:10px}
.catbtn{white-space:nowrap;padding:9px 12px}
.search{margin-bottom:10px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;max-height:calc(100vh - 260px);overflow:auto;padding:2px}
.item{border:1px solid var(--line);border-radius:10px;padding:11px;text-align:left;background:white;cursor:pointer;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.item:hover{border-color:#60a5fa;background:#f8fbff}
.item b{font-size:12px;line-height:1.35}
.price{font-weight:bold;color:#1d4ed8;font-size:13px}
.cart{max-height:38vh;overflow:auto}
.cartrow{border-bottom:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:1fr auto;gap:8px}
.cartrow b{font-size:12px}
.cartrow small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:5px;margin-top:6px}
.qty button{border:1px solid var(--line);background:#f8fafc;border-radius:6px;padding:3px 8px;cursor:pointer}
.totals{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:13px}
.totalrow{display:flex;justify-content:space-between;margin:7px 0}
.grand{font-size:18px;font-weight:bold;color:#be185d}
.primary,.secondary,.danger{border:0;border-radius:9px;padding:11px 12px;font-weight:bold;cursor:pointer}
.primary{background:var(--blue);color:white}
.secondary{background:#e2e8f0;color:#172033}
.danger{background:#fee2e2;color:#991b1b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.wide{grid-column:1/-1}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.empty{text-align:center;color:#94a3b8;padding:30px 5px}
@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.orderpanel{grid-column:1/-1}.cart{max-height:260px}}
@media(max-width:650px){.layout{grid-template-columns:1fr;padding:8px}.leftpanel{order:1}.menupanel{order:2}.orderpanel{order:3}.items{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.cart{max-height:280px}}
</style>
</head>
<body>

<header>
 <div class="brand">The Stage Café
  <small>CAFE & CAKE BAR · POS</small>
 </div>
 <div class="topmeta">KIRILLAWALA · Restaurant POS</div>
</header>

<div class="layout">

<aside class="panel leftpanel">
<h3>Order Details</h3>

<div class="service" id="serviceButtons">
<button class="active" data-service="Dining">Dining</button>
<button data-service="Takeaway">Takeaway</button>
<button data-service="Pickup">Pickup</button>
<button data-service="Delivery">Delivery</button>
</div>

<div class="field">
<label>Steward / Cashier</label>
<select id="steward">
<option>Prabath</option>
<option>Chanaka</option>
<option>Danushka</option>
<option>Supun</option>
<option>Praath</option>
<option>Vihaga</option>
<option>Kesara</option>
<option>Bashitha</option>
</select>
</div>

<div class="field">
<label>Table Number</label>
<select id="table">
<option value="">Choose table</option>
<script>
for(let i=1;i<=20;i++)document.write(`<option>${i}</option>`);
</script>
</select>
</div>

<div class="field">
<label>Customer Name</label>
<input id="customer" placeholder="Customer name">
</div>

<div class="field">
<label>Customer Phone</label>
<input id="phone" placeholder="Phone number" inputmode="tel">
</div>

<div class="field">
<label>Order Note</label>
<textarea id="orderNote" rows="2" placeholder="Optional note"></textarea>
</div>

<p class="note">Rice and noodles, and each juice flavour, are separate menu items.</p>
</aside>

<main class="panel menupanel">
<h3>Menu Items</h3>
<input class="search" id="search" placeholder="Search menu..." oninput="renderItems()">
<div class="catgrid" id="categories"></div>
<div class="items" id="items"></div>
</main>

<section class="panel orderpanel">
<div>
<h3>Current Order</h3>
<div id="cart" class="cart">
<div class="empty">🛒<br><br>No items yet</div>
</div>

<div class="totals">
<div class="totalrow"><span>Subtotal</span><b id="subtotal">Rs. 0.00</b></div>
<div class="totalrow"><span>Service charge (10%)</span><b id="serviceCharge">Rs. 0.00</b></div>
<div class="totalrow grand"><span>Total</span><span id="total">Rs. 0.00</span></div>

<div class="field" style="margin-top:12px">
<label>Cash Received (Rs.)</label>
<input id="cash" type="number" min="0" placeholder="0" oninput="updateTotals()">
</div>

<div class="totalrow"><span>Change</span><b id="change">Rs. 0.00</b></div>

<div class="actions">
<button class="secondary" onclick="printKot()">Print KOT</button>
<button class="secondary" onclick="printBill()">Print Bill</button>
<button class="danger" onclick="clearOrder()">Clear</button>
<button class="primary" onclick="saveOrder()">Save Order</button>
</div>
</div>
</div>
</section>

</div>

<script>
const menu = [
["Breakfast","English Breakfast",1800],

["Snacks","Pulled Chicken Burger",1800],
["Snacks","Vegetable Spring Roll",900],
["Snacks","Hot Dog",920],
["Bites","Kochchi Sausages",1320],
["Bites","Sausages Grilled / Devilled (06 Nos)",1300],

["Fish","Hot Butter Fish",2000],

["Pasta","Mamma Mia",2150],

["Cold Beverages","Frappe Mocha",820],
["Cold Beverages","Frappe Vanilla",820],
["Cold Beverages","Frappe Caramel",820],
["Water","Mineral Water Small",90],
["Water","Mineral Water Medium",120],
["Hot Beverages","Masala Tea",400],
["Hot Beverages","Milk Coffee",400],
["Hot Beverages","Black Coffee",250],
["Hot Beverages","Cappuccino",700],
["Hot Beverages","Cafe Latte",950],
["Hot Beverages","Cafe Mocha",950],
["Hot Beverages","Espresso",550],
["Hot Beverages","Americano",550],
["Hot Beverages","Hot Chocolate",950],
["Hot Beverages","Black Tea",200]
];

let activeCategory="All Items";
let serviceType="Dining";
let cart=[];

const cats=["All Items",...new Set(menu.map(x=>x[0]))];

const money=n=>"Rs. "+Number(n).toLocaleString("en-LK",{
 minimumFractionDigits:2,
 maximumFractionDigits:2
});

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function renderCats(){
 document.getElementById("categories").innerHTML=cats.map(c=>
 `<button class="catbtn ${c===activeCategory?'active':''}"
 onclick='setCategory(${JSON.stringify(c)})'>${escapeHTML(c)}</button>`
 ).join("");
}

function setCategory(c){
 activeCategory=c;
 renderCats();
 renderItems();
}

function renderItems(){
 let q=document.getElementById("search").value.toLowerCase();
 let list=menu.filter(x=>
  (activeCategory==="All Items"||x[0]===activeCategory)&&
  x[1].toLowerCase().includes(q)
 );

 document.getElementById("items").innerHTML=list.map(x=>
 `<button class="item" onclick='addItem(${JSON.stringify(x[1])},${x[2]})'>
  <b>${escapeHTML(x[1])}</b>
  <span class="price">${money(x[2])}</span>
 </button>`
 ).join("")||'<div class="empty">No matching items</div>';
}

function addItem(name,price){
 let x=cart.find(i=>i.name===name);
 if(x)x.qty++;
 else cart.push({name,price,qty:1});
 renderCart();
}

function changeQty(i,d){
 cart[i].qty+=d;
 if(cart[i].qty<=0)cart.splice(i,1);
 renderCart();
}

function calc(){
 let sub=cart.reduce((s,x)=>s+x.price*x.qty,0);
 let sc=Math.round(sub*.10*100)/100;
 return{sub,sc,total:sub+sc};
}

function renderCart(){
 let el=document.getElementById("cart");

 el.innerHTML=cart.length?cart.map((x,i)=>`
 <div class="cartrow">
  <div>
   <b>${escapeHTML(x.name)}</b><br>
   <small>${money(x.price)} each</small>
   <div class="qty">
    <button onclick="changeQty(${i},-1)">−</button>
    <b>${x.qty}</b>
    <button onclick="changeQty(${i},1)">+</button>
   </div>
  </div>
  <b>${money(x.price*x.qty)}</b>
 </div>
 `).join(""):'<div class="empty">🛒<br><br>No items yet</div>';

 updateTotals();
}

function updateTotals(){
 let {sub,sc,total}=calc();

 document.getElementById("subtotal").textContent=money(sub);
 document.getElementById("serviceCharge").textContent=money(sc);
 document.getElementById("total").textContent=money(total);

 let cash=Number(document.getElementById("cash").value||0);
 document.getElementById("change").textContent=money(Math.max(0,cash-total));
}

function clearOrder(){
 if(confirm("Clear current order?")){
  cart=[];
  document.getElementById("cash").value="";
  renderCart();
 }
}

document.querySelectorAll("[data-service]").forEach(b=>{
 b.addEventListener("click",()=>{
  serviceType=b.dataset.service;
  document.querySelectorAll("[data-service]").forEach(x=>
   x.classList.toggle("active",x===b)
  );
 });
});

function orderInfo(){
 return{
  service:serviceType,
  steward:document.getElementById("steward").value,
  table:document.getElementById("table").value,
  customer:document.getElementById("customer").value,
  phone:document.getElementById("phone").value,
  note:document.getElementById("orderNote").value,
  items:cart.map(x=>({...x})),
  ...calc(),
  cash:Number(document.getElementById("cash").value||0),
  date:new Date().toLocaleString()
 };
}

function saveOrder(){
 if(!cart.length){
  alert("Add items first.");
  return;
 }

 let o=orderInfo();
 let all=[];

 try{
  all=JSON.parse(localStorage.getItem("stageCafeOrders")||"[]");
  if(!Array.isArray(all))all=[];
 }catch(e){all=[]}

 o.billNo=Date.now().toString().slice(-8);
 all.push(o);

 localStorage.setItem("stageCafeOrders",JSON.stringify(all));
 alert("Order saved on this device. Bill No: "+o.billNo);
}

/* KOT AND BILL PAGE CONNECTION */

function openOrderPage(page){
 if(!cart.length){
  alert("Add items first.");
  return;
 }

 const order=orderInfo();
 order.billNo=Date.now().toString().slice(-8);

 const encoded=encodeURIComponent(JSON.stringify(order));
 const url=page+"?data="+encoded;

 const win=window.open(url,"_blank");

 if(!win){
  alert("Please allow pop-ups for this website.");
 }
}

function printKot(){
 openOrderPage("kot.html");
}

function printBill(){
 openOrderPage("bill.html");
}

renderCats();
renderItems();
renderCart();
</script>
</body>
</html>
